function calc(c){

    const tot=meio+at(a)+(t?trein:0)+(+s.o||0)+(sum['p:'+nm]||0)+(sum['p:*']||0)-(f.includes('A')?pen:0);
    return {nm,tot,off:f.includes('T')&&!t}});

    const sk=tp==='Corpo a corpo'?'Luta':(tp==='À distância'||tp==='Arremesso')?'Pontaria':a.teste;

    const ex=ms.map(m=>String(m.dados||'').trim()).filter(Boolean);
    const base=[String(a.dados||'').trim(),...ex].filter(Boolean).join('+');
    const dd=[a.dados||'dados',...ex];if(corpo)dd.push('FOR '+sx(fo));else if(fo)dd.push(a.dAttr+' '+sx(fo));if(bD)dd.push('bônus '+sx(bD));
    return {sk,atq:'1d20'+sx(atq),dano:(base+(db?sx(db):''))||'—',da:'1d20 + '+sk+' '+sx(pv)+(bA?' + bônus '+sx(bA):''),dd:dd.join(' + ')}});

  const d=c.defesa;
  return {at,n,trein,meio,per,acts,pvmax:pv,pmmax:pm,esp,cap,cd:10+meio+at(c.cd.atrib)+(+c.cd.outros||0)+(sum.cd||0),
    def:10+(d.atrib==='-'?0:at(d.atrib))+(+d.armadura||0)+(+d.escudo||0)+(+d.outros||0)+(sum.defesa||0),
    atq:(+c.ataque||0)+(sum.ataque||0),dano:sum.dano||0,desloc:(+c.desloc||0)+(sum.desloc||0),
    pvtemp:(+c.pv.temp||0)+(sum.pvtemp||0),pmtemp:(+c.pm.temp||0)+(sum.pmtemp||0)};
}
function refresh(){

const ESCOLAS=['Abjuração','Adivinhação','Convocação','Encantamento','Evocação','Ilusão','Necromancia','Transmutação'];

const ITEMLIKE=/^(\+\d|Truque|Requer)/;

  }

  const ok=pos.filter(Boolean);
  ok.forEach((p,j)=>{const fim=j+1<ok.length?ok[j+1].i:null;if(fim!==null)d[p.k]=hj.slice(p.e,fim).replace(/\s+/g,' ').trim()});
  const lr=ok.find(p=>p.k==='res');

    const tail=hj.slice(lr.e).split('\n').map(s=>s.trim()).filter(Boolean);
    if(tail.length>1){d.res=tail[0];d.desc=tail.slice(1).join('\n')}

function applySpell(m,d){['nome','livro','tipo','esc','exec','alc','alvo','dur','res','desc','aprim'].forEach(k=>{if(d[k])m[k]=d[k]});if(d.circ)m.circ=d.circ}
const stat=(m,t)=>{S.st=S.st||{};S.st[m.id]=t};
async function pullSpell(c,m){
  let U;try{U=new URL(href(m.url))}catch(e){stat(m,'Link inválido.');return sheet()}
  let hash='';try{hash=decodeURIComponent(U.hash.slice(1))}catch(e){hash=U.hash.slice(1)}
  if(!hash){stat(m,'O link precisa terminar com #nome-da-magia, como em .../magias#acalmar-animal.');return sheet()}
  U.hash='';stat(m,'Buscando a magia no site…');sheet();
  let html;
  try{const r=await fetch(U.href);if(!r.ok)throw new Error('HTTP '+r.status);html=await r.text()}
  catch(e){stat(m,'Não consegui ler o site daqui (o navegador bloqueia a leitura de outro endereço). Hospede esta ficha no próprio site ou use “Colar o texto da magia”.');return sheet()}
  const r=cardFromDoc(new DOMParser().parseFromString(html,'text/html'),hash),d=parseSpell(r.lines,r.want);
  if(!d){stat(m,'Não encontrei a magia “'+hash+'” nessa página.');return sheet()}
  applySpell(m,d);stat(m,'Importado do site: '+d.nome+'.');save();sheet();
}

document.addEventListener('input',e=>{
  const t=e.target,c=C();if(!c)return;
  if(t.dataset.p){set(c,t.dataset.p,t.type==='checkbox'?t.checked:t.dataset.n?(t.value===''?0:+t.value):t.value);after()}
  else if(t.dataset.pi!==undefined&&t.dataset.a!=='tmacro'){
    const p=c[t.dataset.l][t.dataset.pi],v=t.type==='number'||t.dataset.n?(t.value===''?0:+t.value):t.value;
    if(t.dataset.mi!==undefined)p.macros[t.dataset.mi][t.dataset.k]=v;else if(t.dataset.ei!==undefined)p.efs[t.dataset.ei][t.dataset.k]=v;else p[t.dataset.k]=v;
    after();if(t.dataset.l==='acoes'&&t.dataset.k==='tipo'){save();sheet()}
  }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,c=C(),L=c&&c[t.dataset.l||''],p=L&&L[t.dataset.pi];
  if(a==='new'){const n=novo();S.chars.push(n);S.cur=n.id;S.tab='basico';save();sheet();scrollTo(0,0)}
  else if(a==='open'){S.cur=t.dataset.id;S.tab='ficha';ED=false;sheet();scrollTo(0,0)}
  else if(a==='home'){save();home()}
  else if(a==='del'){if(confirm('Excluir esta ficha? Isso não pode ser desfeito.')){S.chars=S.chars.filter(x=>x.id!==t.dataset.id);save();home()}}
  else if(a==='imp'){pick('imp','.json,application/json')}
  else if(a==='foto'){pick('foto','image/*')}
  else if(a==='rmfoto'){c.foto='';save();sheet()}
  else if(a==='exp'){dl(c.nome,c)}
  else if(a==='expall'){dl('backup-fichas-t20',{chars:S.chars})}
  else if(a==='add'){const l=t.dataset.l;c[l].push(l==='magias'?novaMagia():l==='acoes'?novaAcao():fixM({cat:t.dataset.cat,...(l==='itens'?{espaco:1,qnt:1,valor:''}:{})}));save();sheet()}
  else if(a==='tab'){S.tab=t.dataset.t;sheet();scrollTo(0,0)}
  else if(a==='adj'){const x=c[t.dataset.k];x.atual=(+x.atual||0)+(+t.dataset.d);if(t.dataset.k==='pm')x.atual=Math.max(0,x.atual);const i=document.querySelector('[data-p="'+t.dataset.k+'.atual"]');if(i)i.value=x.atual;after()}
  else if(a==='addc'){c.classes.push({nome:'',niveis:1,pvIni:0,pvNivel:0,pmNivel:0});save();sheet()}
  else if(a==='delc'){if(c.classes.length>1){c.classes.splice(+t.dataset.ci,1);save();sheet()}}
  else if(a==='rest'){const o=calc(c);c.pv.atual=o.pvmax;c.pm.atual=o.pmmax;save();sheet()}
  else if(a==='delp'){L.splice(+t.dataset.pi,1);save();sheet()}
  else if(a==='tmacro'){p.macro=t.checked;if(p.macro&&!p.efs.length)p.efs.push({alvo:'defesa',valor:0});if(!p.macro)p.ativo=false;save();sheet()}
  else if(a==='addam'){p.macros.push({id:uid(),nome:'',atq:0,dano:0,dados:'',ativo:false});save();sheet()}
  else if(a==='delam'){p.macros.splice(+t.dataset.mi,1);save();sheet()}
  else if(a==='togam'){const m=p.macros[+t.dataset.mi];m.ativo=!m.ativo;save();sheet()}
  else if(a==='togp'){p.ativo=!p.ativo;save();sheet()}
  else if(a==='led'){ED=!ED;sheet()}
  else if(a==='lup'||a==='ldn'){const i=c.layout.findIndex(l=>l.id===t.dataset.id),j=a==='lup'?i-1:i+1;if(i>=0&&j>=0&&j<c.layout.length){[c.layout[i],c.layout[j]]=[c.layout[j],c.layout[i]];save();sheet()}}
  else if(a==='lvis'){const l=c.layout.find(x=>x.id===t.dataset.id);l.on=!l.on;save();sheet()}
  else if(a==='lpre'){c.layout=PRE[t.dataset.v].map(id=>({id,on:true}));save();sheet()}
  else if(a==='pull'){pullSpell(c,p)}
  else if(a==='parse'){const tx=t.closest('details').querySelector('textarea').value,ls=tx.split('\n').map(x=>x.trim()).filter(Boolean),h=String(p.url||'').split('#')[1];let w='';try{w=slugf(decodeURIComponent(h||''))}catch(e){}const d=ls.length?parseSpell(ls,w||null):null;if(!d)stat(p,'Não reconheci o texto. Copie o card inteiro da magia, do nome até os aprimoramentos.');else{applySpell(p,d);stat(p,'Preenchido com o texto colado: '+d.nome+'.');save()}sheet()}
  else if(a==='adde'){p.efs.push({alvo:'defesa',valor:0});save();sheet()}
  else if(a==='dele'){p.efs.splice(+t.dataset.ei,1);save();sheet()}
});
document.addEventListener('change',e=>{const t=e.target,c=C();if(c&&t.dataset&&t.dataset.l==='magias'&&t.dataset.k==='url'&&String(t.value).includes('#')){const m=c.magias[t.dataset.pi];if(m)pullSpell(c,m)}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sid)OP[d.dataset.sid]=d.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.a==='foto')pick('foto','image/*')});

// ---- arquivos: importar, baixar, foto ----
function pick(mode,accept){const f=$('#fi');f.dataset.mode=mode;f.accept=accept;f.click()}
$('#fi').addEventListener('change',e=>{
  const f=e.target.files[0],mode=e.target.dataset.mode;e.target.value='';if(!f)return;
  if(mode==='foto')resize(f);else f.text().then(imp).catch(()=>toast('Arquivo inválido. Use um .json baixado desta página.'));
});
function imp(txt){
  const d=JSON.parse(txt),arr=d.chars||(Array.isArray(d)?d:[d]);let n=0;
  arr.forEach(x=>{if(!x||typeof x!=='object')return;const c=norm(x),i=S.chars.findIndex(y=>y.id===c.id);i>=0?S.chars[i]=c:S.chars.push(c);n++});
  save();home();toast(n+' ficha(s) importada(s).');
}
function dl(name,obj){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));
  a.download=(name||'ficha').replace(/[^\w-]+/g,'_')+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function resize(f){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    C().foto=cv.toDataURL('image/jpeg',.82);save();sheet();
  };im.src=r.result};
  r.readAsDataURL(f);
}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>';
const luz=()=>document.documentElement.getAttribute('data-theme')==='light';
const icone=()=>{$('#tt').innerHTML=luz()?MOON:SUN};
$('#tt').addEventListener('click',()=>{const n=luz()?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('a-tormenta-theme',n)}catch(e){}icone()});
icone();home();
