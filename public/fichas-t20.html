<script>
const KEY='fichas-t20-v1';
const ATTRS=['FOR','DES','CON','INT','SAB','CAR'];
// [nome, atributo, flags] T = só treinada, A = penalidade de armadura
const SK=[['Acrobacia','DES','A'],['Adestramento','CAR','T'],['Atletismo','FOR',''],['Atuação','CAR',''],['Cavalgar','DES',''],['Conhecimento','INT','T'],['Cura','SAB',''],['Diplomacia','CAR',''],['Enganação','CAR',''],['Fortitude','CON',''],['Furtividade','DES','A'],['Guerra','INT','T'],['Iniciativa','DES',''],['Intimidação','CAR',''],['Intuição','SAB',''],['Investigação','INT',''],['Jogatina','CAR','T'],['Ladinagem','DES','AT'],['Luta','FOR',''],['Misticismo','INT','T'],['Nobreza','INT','T'],['Ofício','INT','T'],['Percepção','SAB',''],['Pilotagem','DES','T'],['Pontaria','DES',''],['Reflexos','DES',''],['Religião','SAB','T'],['Sobrevivência','SAB',''],['Vontade','SAB','']];
const ALVOS=[...ATTRS.map(a=>['a:'+a,'Atributo '+a]),['defesa','Defesa'],['ataque','Ataque (nas ações que puxarem)'],['dano','Dano (nas ações que puxarem)'],['desloc','Deslocamento (m)'],['penal','Penalidade de armadura'],['cd','CD das magias'],['cap','Limite de espaço (carga)'],['limpm','Limite de PM por magia'],['gpm','Custo de PM (botão Gastar)'],['pvmax','PV máximo'],['pmmax','PM máximo'],['pvtemp','PV temporários'],['pmtemp','PM temporários'],['p:*','Todas as perícias'],...SK.map(s=>['p:'+s[0],'Perícia: '+s[0]])];

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sg=n=>n>0?'+'+n:String(n),sx=n=>n<0?String(n):'+'+n;
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const ks=p.split('.'),l=ks.pop();ks.reduce((a,k)=>a[k]??(a[k]={}),o)[l]=v};

const CATS=['Habilidades de classe','Poderes de classe','Raça','Origem','Gerais','Complicações','Divindade'];
const ICATS=['Equipamento e vestuário','Alquímicos','Alimentos','Armas, armaduras e escudos'];
const PARC=['1º parceiro','2º parceiro (nível 5 a 16)','3º parceiro (nível 17 ou mais)','Familiar (arcanistas com o poder Familiar)'];
const fixM=p=>({id:uid(),nome:'',efeito:'',macro:false,ativo:false,fixo:false,url:'',...p,efs:p.efs||[]});
const mgpm=p=>{if(p.gpm&&+p.pm>0&&!p.efs.some(e=>e.alvo==='gpm')){p.macro=true;p.efs=[...p.efs,{alvo:'gpm',valor:+p.pm}]}delete p.gpm;delete p.pm;delete p.opcoes;return p};
const fe=(p,k)=>p.efs.reduce((t,e)=>t+(e.alvo===k?(+e.valor||0):0),0);
const rm=(c,m)=>{if(!m.src)return m;const p=[...c.poderes,...c.itens].find(x=>x.id===m.src);if(p){m.nome=p.nome||m.nome;m.atq=fe(p,'ataque');m.dano=fe(p,'dano')}return m};
const novaAcao=()=>({id:uid(),nome:'',tipo:'Corpo a corpo',teste:'Luta',bAtq:0,dados:'',dAttr:'-',bDano:0,crit:'',tdano:'',alc:'',obs:'',atrA:'',atrX:[],dA:'',dX:[],macros:[]});
const LAY=['atributos','vida','resist','defesa','macros','macrosit','poderes','magias','acoes','pericias'];
const LAYT={atributos:'Atributos',vida:'Vida e mana',resist:'Resistências',defesa:'Defesa, deslocamento e CD',macros:'Macros de habilidades e poderes',macrosit:'Macros de equipamentos',poderes:'Habilidades e poderes',magias:'Magias',acoes:'Ações de combate',pericias:'Perícias'};
const PRE={padrao:['atributos','vida','resist','defesa','macros','macrosit','poderes','magias','acoes','pericias'],marcial:['vida','defesa','resist','acoes','macros','poderes','atributos','pericias','magias','macrosit'],conjurador:['vida','magias','resist','macros','poderes','defesa','atributos','acoes','pericias','macrosit']};
const normLay=l=>{const r=(Array.isArray(l)?l:[]).filter((x,i,a)=>x&&LAY.includes(x.id)&&a.findIndex(y=>y.id===x.id)===i).map(x=>({id:x.id,on:x.on!==false}));LAY.forEach((id,i)=>{if(!r.find(x=>x.id===id)){const k=r.findIndex(x=>x.id===LAY[i-1]);r.splice(k>=0?k+1:r.length,0,{id,on:true})}});return r};
const novaMagia=()=>({id:uid(),nome:'',url:'',circ:1,exec:'Padrão',alc:'Pessoal',alvo:'',dur:'',res:'',desc:'',tipo:'',esc:'',aprim:'',livro:''});

const novo=()=>({layout:normLay(),id:uid(),nome:'Novo personagem',raca:'',divindade:'',foto:'',attr:{FOR:0,DES:0,CON:0,INT:0,SAB:0,CAR:0},pv:{atual:0,temp:0,extra:0},pm:{atual:0,temp:0,extra:0},classes:[{nome:'',niveis:1,pvIni:0,pvNivel:0,pmNivel:0}],defesa:{atrib:'DES',outros:0},arm:{nome:'',bonus:0,pen:0},esc:{nome:'',bonus:0,pen:0},res:[],desloc:9,ataque:0,pericias:{},poderes:[],itens:[],magias:[],acoes:[],cd:{atrib:'INT',outros:0},parceiros:PARC.map(()=>fixM({texto:''})),prof:'',obrig:'',tib:[],notas:''});
const norm=x=>{const b=novo();return {...b,...x,layout:normLay(x.layout),id:x.id||uid(),attr:{...b.attr,...x.attr},pv:{...b.pv,...x.pv},pm:{...b.pm,...x.pm},defesa:{...b.defesa,...x.defesa},pericias:x.pericias||{},cd:{...b.cd,...x.cd},arm:x.arm?{...b.arm,...x.arm}:{...b.arm,bonus:+(x.defesa&&x.defesa.armadura)||0,pen:Math.abs(+x.penalidade||0)},esc:x.esc?{...b.esc,...x.esc}:{...b.esc,bonus:+(x.defesa&&x.defesa.escudo)||0},res:(x.res||[]).map(r=>({id:uid(),tipo:'',rd:0,imune:false,vuln:false,origem:'',...r})),parceiros:PARC.map((t,i)=>fixM({texto:'',...(x.parceiros||[])[i]})),tib:(x.tib||[]).map(t=>({id:uid(),desc:'',ganho:0,gasto:0,...t})),acoes:(x.acoes||[]).map(a=>({...novaAcao(),...a,dA:a.dA!==undefined?a.dA:(a.dAttr&&a.dAttr!=='-'?a.dAttr:''),macros:(a.macros||[]).map(m=>({id:uid(),nome:'',atq:0,dano:0,dados:'',ativo:false,...m}))})),
  magias:(x.magias||[]).map(m=>({...novaMagia(),...m})),
  classes:x.classes?.length?x.classes:[{...b.classes[0],nome:x.classe||'',niveis:+x.nivel||1}],
  poderes:(x.poderes||[]).map(p=>mgpm(fixM({...p,cat:p.cat==='Classe'?'Poderes de classe':(p.cat||'Gerais')}))),itens:(x.itens||[]).map(p=>fixM({cat:ICATS[0],espaco:1,qnt:1,valor:'',...p})),
  parceiros:b.parceiros.map((p,i)=>({...p,...(x.parceiros||[])[i]}))}};
const lvl=c=>c.classes.reduce((s,k)=>s+(+k.niveis||0),0)||1;

let S;
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.chars=(S.chars||[]).map(norm);S.cur=null;S.tab='ficha';S.dr=CATS.map(k=>fixM({cat:k}));S.dro=CATS.map(()=>false);S.di=ICATS.map(k=>fixM({cat:k,espaco:1,qnt:1,valor:''}));S.dio=ICATS.map(()=>false);S.dm=novaMagia();S.dmo=false;S.uso=null;S.da=novaAcao();S.dao=false;S.ed=null;
const C=()=>S.chars.find(x=>x.id===S.cur);
function save(){try{localStorage.setItem(KEY,JSON.stringify({chars:S.chars}))}catch(e){toast('Sem espaço para salvar. Baixe um backup e use fotos menores.')}}
let tm;function after(){refresh();clearTimeout(tm);tm=setTimeout(save,250)}
addEventListener('beforeunload',save);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

// ---- cálculo: base + soma dos macros ativos ----
function calc(c){
  const sum={};
  [...c.poderes,...c.itens,...c.parceiros].forEach(p=>{if(p.macro&&p.ativo)p.efs.forEach(e=>{sum[e.alvo]=(sum[e.alvo]||0)+(+e.valor||0)})});
  const at=a=>(+c.attr[a]||0)+(sum['a:'+a]||0);
  const n=lvl(c),meio=Math.floor(n/2),trein=n<7?2:n<15?4:6,pen=Math.max(0,Math.abs(+c.arm.pen||0)+Math.abs(+c.esc.pen||0)+(sum.penal||0));
  const per=SK.map(([nm,a,f])=>{const s=c.pericias[nm]||{},t=!!s.t;
    const tot=meio+at(s.a||a)+(t?trein:0)+(+s.o||0)+(sum['p:'+nm]||0)+(sum['p:*']||0)-(f.includes('A')?pen:0);
    return {nm,tot,off:f.includes('T')&&!t,ea:s.a||a}});
  const acts=c.acoes.map(a=>{
    const tp=a.tipo,corpo=tp==='Corpo a corpo'||tp==='Arremesso',livre=tp==='Mágico'||tp==='Outro';
    const sk=tp==='Corpo a corpo'?'Luta':(tp==='À distância'||tp==='Arremesso')?'Pontaria':a.teste;
    const pk=per.find(p=>p.nm===sk),ms=(a.macros||[]).map(m=>rm(c,m)).filter(m=>m.ativo);
    const xa=a.atrX||[],ax=xa.reduce((t,x)=>t+at(x),0),sw=a.atrA&&pk?at(a.atrA)-at(pk.ea):0;
    const bA=(+a.bAtq||0)+ms.reduce((t,m)=>t+(+m.atq||0),0),pb=pk?pk.tot:0,atq=pb+sw+ax+bA;
    const dn=a.dA==='none'?'':(a.dA||(corpo?'FOR':(livre&&a.dAttr&&a.dAttr!=='-'?a.dAttr:''))),xd=a.dX||[];
    const bD=(+a.bDano||0)+ms.reduce((t,m)=>t+(+m.dano||0),0),db=(dn?at(dn):0)+xd.reduce((t,x)=>t+at(x),0)+bD;
    const ex=ms.map(m=>String(m.dados||'').trim()).filter(Boolean);
    const base=[String(a.dados||'').trim(),...ex].filter(Boolean).join('+');
    const dd=[a.dados||'dados',...ex];if(dn)dd.push(dn+' '+sx(at(dn)));xd.forEach(x=>dd.push(x+' '+sx(at(x))));if(bD)dd.push('bônus '+sx(bD));
    return {sk,atq:'1d20'+sx(atq),dano:(base+(db?sx(db):''))||'—',da:'1d20 + '+sk+' '+sx(pb)+(sw?' + troca para '+a.atrA+' '+sx(sw):'')+xa.map(x=>' + '+x+' '+sx(at(x))).join('')+(bA?' + bônus '+sx(bA):''),dd:dd.join(' + ')}});
  // vida e mana automáticas: 1ª classe dá PV inicial + CON no 1º nível; todo nível seguinte dá PV por nível + CON
  const con=at('CON');let pv=(+c.pv.extra||0)+(sum.pvmax||0),pm=(+c.pm.extra||0)+(sum.pmmax||0);
  c.classes.forEach((k,i)=>{const q=+k.niveis||0,pl=(+k.pvNivel||0)+con;pv+=i===0&&q>0?(+k.pvIni||0)+con+(q-1)*pl:q*pl;pm+=q*(+k.pmNivel||0)});
  const fo=at('FOR'),cap=(fo>0?10+fo*2:10+fo)+(sum.cap||0),esp=c.itens.reduce((t,i)=>t+(+i.espaco||0)*(+i.qnt||0),0);
  const d=c.defesa;
  return {at,n,trein,meio,per,acts,pen,lim:n+(sum.limpm||0),pvmax:pv,pmmax:pm,esp,cap,cd:10+meio+at(c.cd.atrib)+(+c.cd.outros||0)+(sum.cd||0),
    def:10+(d.atrib==='-'?0:at(d.atrib))+(+c.arm.bonus||0)+(+c.esc.bonus||0)+(+d.outros||0)+(sum.defesa||0),
    atq:(+c.ataque||0)+(sum.ataque||0),dano:sum.dano||0,desloc:(+c.desloc||0)+(sum.desloc||0),
    pvtemp:(+c.pv.temp||0)+(sum.pvtemp||0),pmtemp:(+c.pm.temp||0)+(sum.pmtemp||0),pvtm:sum.pvtemp||0,pmtm:sum.pmtemp||0,pvmm:sum.pvmax||0,pmmm:sum.pmmax||0,tib:(c.tib||[]).reduce((t,e)=>t+(+e.ganho||0)-(+e.gasto||0),0)};
}
function refresh(){
  const c=C();if(!c)return;const o=calc(c);
  const m={pen:o.pen?'−'+o.pen:'0',cd:o.cd,nivel:o.n,esp:o.esp+' de '+o.cap,def:o.def,atq:sg(o.atq),dano:sg(o.dano),desloc:o.desloc+' m',pvmax:o.pvmax,pmmax:o.pmmax,pvmm:o.pvmm?'('+sg(o.pvmm)+' de macros)':'',pmmm:o.pmmm?'('+sg(o.pmmm)+' de macros)':'',tib:'T$ '+Math.round(o.tib*100)/100,pvtemp:o.pvtemp,pmtemp:o.pmtemp,pvtm:o.pvtm?sg(o.pvtm)+' de macros ativos':'',pmtm:o.pmtm?sg(o.pmtm)+' de macros ativos':'',trein:sg(o.trein),meio:o.meio};
  ATTRS.forEach(a=>{m['a:'+a]=o.at(a);m['f:'+a]=sg(o.at(a))});
  o.per.forEach(p=>m['s:'+p.nm]=p.off?'—':sg(p.tot));
  o.acts.forEach((x,i)=>{m['ac:'+i+':atq']=x.atq;m['ac:'+i+':dano']=x.dano;m['ac:'+i+':sk']=x.sk;m['ac:'+i+':da']=x.da;m['ac:'+i+':dd']=x.dd});
  document.querySelectorAll('[data-o]').forEach(e=>{const v=m[e.dataset.o];if(v!==undefined)e.textContent=v});
  const eb=document.querySelector('[data-o=esp]');if(eb)eb.classList.toggle('bad',o.esp>o.cap);
  document.querySelectorAll('progress[data-pg]').forEach(p=>{const k=p.dataset.pg;p.max=Math.max(1,o[k+'max']);p.value=Math.max(0,+c[k].atual||0)});
}

// ---- telas ----
const CORN='<svg viewBox="0 0 32 32" width="26" height="26" fill="none" aria-hidden="true" class="co CLS"><path d="M3 29V12C3 6.48 7.48 2 13 2H29" stroke="rgb(var(--accent-rgb))" stroke-width="1.6" stroke-linecap="round"/><path d="M3 21c5 0 8 3 8 8" stroke="rgb(var(--accent-rgb))" stroke-width="1" stroke-linecap="round" opacity=".55"/><circle cx="3" cy="2" r="4" stroke="rgb(var(--accent-rgb))" stroke-width="1" opacity=".5"/><circle cx="3" cy="2" r="2.2" fill="rgb(var(--accent-rgb))"/></svg>';
const CORNERS=['co1','co2','co3','co4'].map(k=>CORN.replace('CLS',k)).join('');
const TITULO='<div class="ttl"><h1 class="ptitle">Fichas</h1><div class="orn"><svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="rgb(var(--accent-rgb))" stroke-width="1"><path d="M1 7c4-6 8-6 10 0s6 6 10 0"/><circle cx="11" cy="7" r="1.4" fill="rgb(var(--accent-rgb))" stroke="none"/></svg><i></i></div><p class="sub2">Crie, guarde e use suas fichas de Tormenta 20.</p></div>';
function crumb(c){const h='<a href="/">Início</a><span class="sep">/</span>';$('#crumb').innerHTML=c?h+'<button data-a="home">Fichas</button><span class="sep">/</span><span class="cur">'+esc(c.nome||'Personagem')+'</span>':h+'<span class="cur">Fichas</span>'}
function home(){
  S.cur=null;crumb();
  $('#app').innerHTML=`${TITULO}<header><h2 class="pg">Seus personagens</h2><div class="bar"><button class="pri" data-a="new">Nova ficha</button><button data-a="imp">Importar .json</button><button data-a="expall">Backup de todas</button></div></header>
  <main class="grid">${S.chars.map(c=>`<article class="card">${CORNERS}<div class="cph">${c.foto?`<img src="${c.foto}" alt="">`:esc((c.nome||'?')[0])}</div><div><h3>${esc(c.nome)}</h3><p>${esc([c.raca,c.classes.map(k=>k.nome).filter(Boolean).join(' / ')].filter(Boolean).join(', ')||'Sem raça ou classe')}, nível ${lvl(c)}</p></div><div class="bar"><button class="pri" data-a="open" data-id="${c.id}">Abrir</button><button class="ghost" data-a="del" data-id="${c.id}">Excluir</button></div></article>`).join('')||'<p class="empty">Nenhum personagem ainda. Crie a primeira ficha ou importe um .json.</p>'}</main>`;
}
const alvos=s=>ALVOS.map(([v,l])=>`<option value="${v}"${v===s?' selected':''}>${l}</option>`).join('');
const LS=(c,l)=>l==='dr'?S.dr:l==='di'?S.di:l==='dm'?[S.dm]:l==='da'?[S.da]:c[l];
const grow=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'};
const growAll=()=>document.querySelectorAll('textarea[data-l],textarea[data-p]').forEach(t=>{if(t.offsetParent)grow(t)});
const card=(l,p,i)=>{const d=`data-l="${l}" data-pi="${i}"`,it=l==='itens'||l==='di',dr=l==='dr'||l==='di';return `<article class="pw${p.macro&&p.ativo&&!dr?' on':''}"><div class="pwh"><input ${d} data-k="nome" placeholder="${it?'Nome do item':dr?'Nome da habilidade ou poder':'Nome'}" value="${esc(p.nome)}">${dr?'':`<button class="ghost" data-a="delp" ${d}>Remover</button>`}</div>
  ${it?`<div class="ef3"><label>Espaço<input type="number" step="any" ${d} data-k="espaco" value="${p.espaco}"></label><label>Quantidade<input type="number" ${d} data-k="qnt" value="${p.qnt}"></label><label>Valor<input ${d} data-k="valor" value="${esc(p.valor)}"></label></div>`:''}
  ${it?'':`<label>Link do poder no site (opcional)<span class="urlrow"><input ${d} data-k="url" placeholder="https://a-tormenta.vercel.app/poderes/bucaneiro#Nome%20do%20poder" value="${esc(p.url)}"><button data-a="pullp" ${d}>Puxar do link</button></span></label>${S.st&&S.st[p.id]?`<p class="hint">${esc(S.st[p.id])}</p>`:''}`}
  <textarea ${d} data-k="efeito" rows="${it?2:6}\" placeholder="Descrição e efeito">${esc(p.efeito)}</textarea>
  ${it&&!p.macro?'':`<label class="chk"><input type="checkbox" data-a="tfix" ${d} ${p.fixo?'checked':''}> ${it?'Mostrar o macro na ficha inicial':'Mostrar na ficha inicial'}</label>`}

combate:c=>`<section class="card"><h2>Ações de combate</h2><p class="hint">O teste de ataque é automático: 1d20 + Luta (corpo a corpo) ou Pontaria (à distância e arremesso). No corpo a corpo e no arremesso o dano soma a Força; disparo não soma. Você só informa os dados e os bônus. Para poderes que trocam o atributo, use “trocar”; para somar mais de um atributo, marque “Somar ao ataque” ou “Somar ao dano”. Toque em Adicionar ação, preencha e toque em Adicionar à lista. Depois, toque no nome para ler ou em Editar para mudar.</p>${S.dao?acEd(c,S.da,'da',0):`<div class="bar"><button class="pri" data-a="dao">Adicionar ação</button>${String(S.da.nome).trim()?'<span class="hint" style="align-self:center;margin:0">Rascunho guardado</span>':''}</div>`}${c.acoes.length?`<h3 class="sub">Adicionadas (${c.acoes.length})</h3>`:''}${c.acoes.map((a,i)=>a.id===S.ed?acEd(c,a,'acoes',i):rowA(a,i)).join('')}</section>`,

itens:c=>`${ITOP(c)}${S.itab==='tib'?TIB(c):''}<section class="card"${S.itab==='tib'?' hidden':''}><h2>Itens</h2><p class="hint">Escreva no quadro “Adicionar item” e toque em Adicionar à lista. Depois, toque no nome para ler ou em Editar para mudar.</p>${ICATS.map((k,di)=>{const list=c.itens.map((p,i)=>[p,i]).filter(([p])=>p.cat===k);return `<h3 class="sub">${k}</h3>${S.dio[di]?card('di',S.di[di],di):`<div class="bar"><button class="pri" data-a="dio" data-pi="${di}">Adicionar item</button>${String(S.di[di].nome).trim()?'<span class="hint" style="align-self:center;margin:0">Rascunho guardado</span>':''}</div>`}${list.length?`<h4 class="sub" style="margin-top:12px">Adicionados (${list.length})</h4>`:''}${list.map(([p,i])=>p.id===S.ed?card('itens',p,i):rowI(p,i)).join('')}`}).join('')}</section>`,
parceiros:c=>`<section class="card"><h2>Parceiros e familiar</h2><p class="hint">Toque no parceiro para ler. Em Editar você muda nome, ficha e macro. Cada parceiro pode ter um macro, por exemplo uma mula que aumenta o limite de espaço (efeito “Limite de espaço (carga)”).</p>${PARC.map((t,i)=>{const p=c.parceiros[i];if(p.id===S.ed){const d=`data-l="parceiros" data-pi="${i}"`;return `<article class="pw"><h3 class="sub" style="margin-top:0">${t}</h3>${inp(c,'parceiros.'+i+'.nome','Nome')}<label>Ficha e anotações<textarea data-p="parceiros.${i}.texto" rows="5">${esc(p.texto)}</textarea></label>${macEd(d,p)}<div class="bar" style="margin-top:8px"><button class="pri" data-a="done">Concluir edição</button></div></article>`}const vazio=!p.nome&&!p.texto&&!p.macro;return `<details class="spl" data-sid="${p.id}"${OP[p.id]?' open':''}><summary><span class="spn">${esc(p.nome||t)}</span><small>${esc(p.nome?t+(p.macro?(p.ativo?', macro ativo':', macro'):''):'vazio')}</small></summary><div class="spb">${p.texto?`<p class="spd">${esc(p.texto)}</p>`:'<p class="hint">Sem anotações.</p>'}${p.macro?`<p class="hint">Macro: ${esc(efsTxt(p))}</p>`:''}<div class="bar">${p.macro?`<button class="${p.ativo?'pri':''}" data-a="togp" data-l="parceiros" data-pi="${i}">${p.ativo?'Ativo':'Ativar'}</button>`:''}<button data-a="edp" data-id="${p.id}">${vazio?'Preencher':'Editar'}</button></div></div></details>`}).join('')}</section>`,
macros:c=>{const row=(p,i,l,sub)=>`<div class="mrow"><button class="${p.ativo?'pri':''}" data-a="togp" data-l="${l}" data-pi="${i}">${p.ativo?(l==='itens'?'Equipado':'Ativo'):(l==='itens'?'Equipar':'Ativar')}</button><div><b>${esc(p.nome||'Sem nome')}</b> <small>${esc(sub)}</small><br><span>${esc(efsTxt(p))}</span></div><label class="chk" style="margin:0 0 0 auto"><input type="checkbox" data-a="tfix" data-l="${l}" data-pi="${i}" ${p.fixo?'checked':''}> Na ficha inicial</label></div>`,sec=(t,r)=>r.length?`<h3 class="sub">${t}</h3>${r.join('')}`:'',

 return `<section class="card"><h2>Todos os macros</h2><p class="hint">Veja e ligue ou desligue todos os macros num só lugar. Eles continuam sendo criados e editados nas abas de origem.</p>${P+I+R+A||'<p class="hint">Nenhum macro criado ainda.</p>'}</section>`},

document.addEventListener('input',e=>{

document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sid)OP[d.dataset.sid]=d.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.a==='foto')pick('foto','image/*')});

// ---- arquivos: importar, baixar, foto ----
function pick(mode,accept){const f=$('#fi');f.dataset.mode=mode;f.accept=accept;f.click()}
$('#fi').addEventListener('change',e=>{
  const f=e.target.files[0],mode=e.target.dataset.mode;e.target.value='';if(!f)return;
  if(mode==='foto')resize(f);else f.text().then(imp).catch(()=>toast('Arquivo inválido. Use um .json baixado desta página.'));
});
function imp(txt){
  const d=JSON.parse(txt),arr=d.chars||(Array.isArray(d)?d:[d]);let n=0;
  arr.forEach(x=>{if(!x||typeof x!=='object')return;const c=norm(x),i=S.chars.findIndex(y=>y.id===c.id);i>=0?S.chars[i]=c:S.chars.push(c);n++});
  save();home();toast(n+' ficha(s) importada(s).');
}
function dl(name,obj){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));
  a.download=(name||'ficha').replace(/[^\w-]+/g,'_')+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function resize(f){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    C().foto=cv.toDataURL('image/jpeg',.82);save();sheet();
  };im.src=r.result};
  r.readAsDataURL(f);
}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>';
const luz=()=>document.documentElement.getAttribute('data-theme')==='light';
const icone=()=>{$('#tt').innerHTML=luz()?MOON:SUN};
$('#tt').addEventListener('click',()=>{const n=luz()?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('a-tormenta-theme',n)}catch(e){}icone()});
icone();home();if(document.fonts)document.fonts.ready.then(growAll);
</script>
